name: Deploy React preview to GitHub Pages

on:
  push:
    branches:
      - feature/react-ui-design-system
    paths:
      - "react-app/**"
      - ".github/workflows/deploy-react-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: react-pages-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        working-directory: react-app
        run: npm ci

      - name: Validate routes
        working-directory: react-app
        run: npm run check

      - name: Build React preview
        working-directory: react-app
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload React build
        uses: actions/upload-pages-artifact@v3
        with:
          path: react-app/dist

      - name: Deploy React preview
        id: deployment
        uses: actions/deploy-pages@v4
